  const q=el('input',{type:'text',value:catQ,placeholder:'ara: değişken, yüzey, dosya… (boşlukla birden çok kelime)',style:'width:420px',oninput:e=>{catQ=e.target.value;store.set('catQ',catQ);fillT();}});
  const tw=el('div',{class:'tw'}),sw=el('div',{class:'tw'});
  host.append(card(el('h2',{},'Bulunan tüm skaler değerler'),help('Analiz klasörlerinde okunan her şey. Analizleri ham değerleriyle yan yana karşılaştırmak için de kullanılabilir. <b>değişken yap</b>: formüllerde kullanmak için ad ver.'),el('div',{class:'tools'},q,el('span',{class:'mut',id:'catn'})),tw),
    card(el('h2',{},'Bulunan seriler (profil / yakınsama geçmişi)'),sw));
  function fillT(){
    const ws=catQ.toLowerCase().split(/\s+/).filter(Boolean);
    const list=[...CAT.values()].filter(c=>{const t=(descSc(c.k)+' '+c.f).toLowerCase();return ws.every(w=>t.includes(w));}).sort((a,b)=>descSc(a.k).localeCompare(descSc(b.k)));
    $('#catn').textContent=list.length+' değer';
    const tb=el('tbody');
    list.slice(0,800).forEach(c=>tb.append(el('tr',{},el('td',{class:'l'},KIND[c.kind]||c.kind),el('td',{class:'l'},c.var),el('td',{class:'l'},c.unit),el('td',{class:'l'},c.surf),
      rows.map(a=>{const s=a.scm.get(c.k);return el('td',{class:s?'':'na',title:s?s.f:''},s?sig(s.v,7):'–');}),
      el('td',{},btn('değişken yap',()=>{const n=prompt('Formüllerde kullanılacak ad (ör. mdot_swirl):',alnum(c.surf+'_'+c.kind).slice(0,20)||'x');if(!n)return;if(!isName(n)||scopeNames().includes(n)){alert('Geçersiz ya da kullanılan ad');return;}M.vars.push({name:n,key:c.k,show:true,over:{}});changed();alert(`'${n}' eklendi. Özet tablosunda sütun olarak görünür; Eşleme > Formüller'de kullanılabilir.`);})))));
    tw.innerHTML='';tw.append(el('table',{class:'sticky'},el('thead',{},el('tr',{},el('th',{class:'l'},'Tür'),el('th',{class:'l'},'Değişken'),el('th',{class:'l'},'Birim'),el('th',{class:'l'},'Yüzey'),rows.map(a=>el('th',{},a.name)),el('th',{},''))),tb));
    if(list.length>800)tw.append(el('div',{class:'mut'},'İlk 800 gösteriliyor, aramayı daralt.'));
  }
  fillT();
  const tb=el('tbody');
  [...SCAT.values()].sort((a,b)=>a.f.localeCompare(b.f)).forEach(c=>tb.append(el('tr',{},el('td',{class:'l'},c.t==='xy'?'profil':'yakınsama'),el('td',{class:'l'},c.f),el('td',{class:'l'},c.nm),el('td',{class:'l'},(c.xl||'')+' / '+(c.yl||'')),el('td',{},c.n+'/'+A.length),
    el('td',{},btn('çiz',()=>{profSel='k:'+c.k;store.set('prof',profSel);showTab('profiles');}),' ',btn('profil olarak ekle',()=>{let k=1;while(M.profiles.some(p=>p.id==='prof'+k))k++;M.profiles.push({id:'prof'+k,label:c.nm||c.f,key:c.k,swap:c.t==='xy',over:{}});changed();alert('Eklendi (Eşleme > Profiller).');})))));
  sw.append(el('table',{},el('thead',{},el('tr',{},['Tür','Dosya','Seri','x / y','Kapsam',''].map(h=>el('th',{class:'l'},h)))),tb));
}

// ================= Notlar =================
function renderNotes(){
  const host=$('#t_notes');host.innerHTML='';
  const tb=el('tbody');
  A.forEach(a=>{const n=M.notes[a.name]||(M.notes[a.name]={});
    const inp=(k,w,ph,type)=>el('input',{type:type||'text',step:'any',style:`width:${w}px`,value:n[k]??'',placeholder:ph,onchange:e=>{n[k]=e.target.value;changed();}});
    tb.append(el('tr',{},el('td',{class:'l'},a.name),el('td',{class:'l'},inp('tags',220,'etiket: ör. dilution+5%')),el('td',{class:'l'},inp('note',460,'not')),
      el('td',{},inp('Tmax_exit',110,'boş = otomatik','number')),el('td',{},a.mtime),
      SERVE?el('td',{},btn('klasörü aç',()=>fetch('api/open',{method:'POST',body:JSON.stringify({rel:a.name})}))):'' ));});
  host.append(card(el('div',{class:'tools'},el('span',{class:'mut'},'Etiketler sol listede filtrelenebilir ve özet tablosunda görünür. T maks çıkış: report’ta Maximum bloğu yoksa OTDF için elle gir.'),statusEl),
    el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},['Analiz','Etiket','Not','T maks çıkış [K]','Son değişiklik',SERVE?'':null].filter(x=>x!==null).map(h=>el('th',{class:'l'},h)))),tb))));
}

// ================= Uyarılar =================
function renderWarn(){
  const host=$('#t_warn');host.innerHTML='';
  const c=card(el('h2',{},'Hesap uyarıları'));let n=0;
  A.forEach(a=>{const w=RES.get(a.name).w;if(!w.length)return;n+=w.length;c.append(el('h3',{style:'margin:8px 0 2px;font-size:13px'},a.name),el('ul',{},w.map(x=>el('li',{},x))));});
  if(!n)c.append('Uyarı yok ✔');
  const t=el('tbody');
  A.forEach(a=>t.append(el('tr',{},el('td',{class:'l'},a.name),el('td',{},a.nfiles),el('td',{},a.parsed.length),el('td',{},a.sc.length),el('td',{},a.sr.length),el('td',{},a.img.length),
    el('td',{class:'l',style:'white-space:normal'},[...a.skipped,...a.errors].join(' · ')||'—'))));
  host.append(c,card(el('h2',{},'Tarama özeti'),help('Okunan dosya = içeriği tanınan metin dosyası (report bloğu, XY, .out, tablo). Bir dosya tanınmıyorsa <code>py postproc.py diag analiz-adı</code> çıktısını paylaş (sayılar maskelenir).'),
    el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},['Analiz','Dosya','Okunan','Skaler','Seri','Görsel','Atlanan / hata'].map(h=>el('th',{class:'l'},h)))),t))));
}

function render(){drawList();({overview:renderOverview,profiles:renderProfiles,split:renderSplit,gallery:renderGallery,map:renderMap,catalog:renderCatalog,notes:renderNotes,warn:renderWarn})[tab]();}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(tab==='profiles')renderProfiles();},200);});
recompute();
if(SERVE&&!D.mapping&&A.length)save();
showTab(TABS.some(t=>t[0]===tab)?tab:'overview');
console.log('%cCombustor Post-Process · '+AUTHOR,'font-weight:bold');
</script>
