<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#667085;--line:#e1e4ea;--acc:#2457d6;--good:#d9f2e0;--bad:#fbdcdc;--ref:#fff6d6;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--fg:#e8eaf0;--mut:#98a2b3;--line:#2d3340;--acc:#7aa2ff;--good:#1d4630;--bad:#51262a;--ref:#4a4220;--warn:#fdb022}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
.mut{color:var(--mut);font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:5px 10px;cursor:pointer;border-radius:6px}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav button .n{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--warn);color:#fff;font-size:11px}
.wrap{display:flex;align-items:flex-start;gap:12px;padding:12px;flex:1}
aside{width:230px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;position:sticky;top:64px;max-height:calc(100vh - 110px);overflow:auto}
aside h3{margin:0 0 6px;font-size:13px}
aside label{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer;font-size:13px}
aside label .dn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside .sw{width:10px;height:10px;border-radius:2px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.btns{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
main{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.card h3{font-size:13px;margin:10px 0 4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
select,input[type=text],input[type=number],textarea,button.b{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
textarea{width:100%;resize:vertical}
select{max-width:520px}
button.b{cursor:pointer}button.b:hover{border-color:var(--acc)}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.b:disabled{opacity:.5;cursor:default}
button.x{border:none;background:none;color:var(--mut);cursor:pointer;font-size:15px;padding:0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-right:1px solid var(--line);background:var(--card);color:var(--fg);padding:4px 10px;cursor:pointer;font:inherit}
.seg button:last-child{border-right:none}.seg button.on{background:var(--acc);color:#fff}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:75vh;cursor:grab}.tw.panning{cursor:grabbing;user-select:none}
.tw input,.tw select,.tw button,.tw textarea{cursor:auto}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:right;white-space:nowrap}
th{background:var(--bg);position:sticky;top:0;z-index:2;font-weight:600}
th.s{cursor:pointer}
th small,td small{display:block;color:var(--mut);font-weight:400;font-size:11px}
th.grp{text-align:center;font-size:12px;color:var(--mut)}
.sticky td:first-child,.sticky th:first-child{position:sticky;left:0;text-align:left;background:var(--card);z-index:3;font-weight:600}
.sticky th:first-child{background:var(--bg);z-index:4}
td.l,th.l{text-align:left}
tr.ref td,td.ref,th.ref{background:var(--ref)!important}
td.best{background:var(--good)}td.worst{background:var(--bad)}
td.na,.na{color:var(--mut)}
.ok{color:#067647}.badc{color:#b42318}
.warn{color:var(--warn)}
.hd{cursor:move;color:var(--mut);padding-right:6px;user-select:none}
.dragging{opacity:.4}
.dropb{box-shadow:inset 0 3px 0 var(--acc)!important}.dropa{box-shadow:inset 0 -3px 0 var(--acc)!important}
.dropl{box-shadow:inset 3px 0 0 var(--acc)!important}.dropr{box-shadow:inset -3px 0 0 var(--acc)!important}
th[draggable=true]{cursor:move}
.colp{display:flex;flex-wrap:wrap;gap:2px 14px;margin:4px 0 8px;font-size:12px}
.colp label{display:flex;gap:4px;align-items:center}
.chart{position:relative;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px #0003;display:none;z-index:6;white-space:nowrap}
.sec{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);user-select:none;touch-action:none}
.sec img{display:block;max-width:100%}
.lab{position:absolute;transform:translate(-50%,-50%);background:#fffffff0;color:#111;border:1.5px solid var(--acc);border-radius:6px;padding:2px 7px;font-size:12px;cursor:grab;text-align:center;box-shadow:0 1px 4px #0004}
.lab b{display:block;font-size:14px}.lab span{font-size:11px}
.lab.up span{color:#b42318}.lab.dn span{color:#067647}
.bars .row{display:flex;align-items:center;gap:8px;margin:3px 0}
.bars .nm{width:140px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .bar{flex:1;display:flex;height:20px;border-radius:4px;overflow:hidden;background:var(--bg)}
.bars .sg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;overflow:hidden}
.grid{display:grid;gap:8px}
.grid figure{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.grid figcaption{padding:3px 6px;font-size:12px;border-top:1px solid var(--line);color:var(--mut);word-break:break-all}
.grid img{display:block;width:100%;height:auto;background:#fff}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;padding:1px 4px 1px 8px;margin:2px;font-size:12px;background:var(--bg)}
.chip.main{border-color:var(--acc);font-weight:600}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.tg{cursor:pointer;padding:1px 8px}
.hide{display:none}
.status{font-size:12px}
.over{margin:2px 0;font-size:12px}
code{background:var(--bg);padding:1px 4px;border-radius:4px;font-size:12px}
.help{font-size:12px;color:var(--mut);margin:4px 0 8px;max-width:1000px}
/* görsel karşılaştırma */
.vgrid{display:grid;gap:8px}
.zv{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:grab;touch-action:none;user-select:none}
.zv.panning{cursor:grabbing}
.zv .lay{position:relative;overflow:hidden}.zv .lay.top{position:absolute;inset:0}
.zv .zin{transform-origin:0 0}
.zv img,.zv canvas{display:block;width:100%;height:auto;pointer-events:none}
.zv .cap{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-size:12px;padding:1px 6px;border-radius:4px;pointer-events:none;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zv .cap.r{left:auto;right:4px}
.zv .bar{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--acc);cursor:ew-resize;z-index:2}
.zv .bar::after{content:'⟷';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--acc);color:#fff;border-radius:10px;padding:2px 6px;font-size:13px}
.zv .miss{padding:40px 10px;text-align:center;color:var(--mut);background:var(--card)}
.vfig{margin:0}.vfig figcaption{font-size:12px;color:var(--mut);padding:2px;word-break:break-all;display:flex;gap:6px;align-items:center}
.mtx td{vertical-align:top;text-align:center}.mtx img{display:block;cursor:pointer;background:#fff;margin:auto}
.mtx td.l{max-width:220px;white-space:normal;word-break:break-all}
#gv:fullscreen{background:var(--bg);overflow:auto;padding:10px}
/* notlar */
.nwrap{display:grid;grid-template-columns:260px 1fr;gap:12px;align-items:start}
.nlist{max-height:75vh;overflow:auto}
.nlist .it{padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.nlist .it:hover{border-color:var(--line)}.nlist .it.on{background:var(--bg);border-color:var(--acc)}
.nlist .it b{display:flex;gap:6px;align-items:center}
.nlist .it div{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frm{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;max-width:980px}
.frm>label{color:var(--mut);font-size:12px;text-align:right}
.log{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0}
.log small{color:var(--mut)}
/* modal */
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.modal>.card{width:min(860px,100%);margin:0}
.opt{display:flex;flex-wrap:wrap;gap:2px 16px;margin:4px 0}
.opt label{display:flex;gap:5px;align-items:center;font-size:13px}
.prog{font-size:12px;color:var(--acc);min-height:16px}
footer{padding:8px 16px;border-top:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--mut)}
footer .sig{font-weight:600;letter-spacing:.3px;color:var(--fg)}
</style>
</head>
<body>
<header>
  <h1>Combustor Post-Process</h1>
  <span class="mut" id="gen"></span>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <span id="srv" class="tools" style="margin:0"></span>
  <label class="mut">Referans: <select id="refSel"></select></label>
</header>
<div class="wrap">
  <aside>
    <h3>Analizler</h3>
    <div class="btns"><button class="b" id="allB">Hepsi</button><button class="b" id="noneB">Hiçbiri</button></div>
    <input type="text" id="aflt" placeholder="filtrele (ad, etiket, not)…" style="width:100%;margin-bottom:4px">
    <div id="alist"></div>
    <div class="mut" style="margin-top:6px">Çift tıkla: yeniden adlandır · sürükle: sırala</div>
  </aside>
  <main id="main"></main>
</div>
<footer>
  <span class="sig" id="sig">Muhammed Emin URAL tarafından geliştirilmiştir</span>
  <span id="fver"></span>
</footer>
