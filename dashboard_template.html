<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Combustor Post-Process Özeti</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#667085;--line:#e1e4ea;--acc:#2457d6;--good:#d9f2e0;--bad:#fbdcdc;--ref:#fff6d6}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--fg:#e8eaf0;--mut:#98a2b3;--line:#2d3340;--acc:#7aa2ff;--good:#1d4630;--bad:#51262a;--ref:#4a4220}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
header .mut{color:var(--mut);font-size:12px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;cursor:pointer;border-radius:6px;margin-right:4px}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.wrap{display:flex;align-items:flex-start;gap:12px;padding:12px}
aside{width:210px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
aside h3{margin:0 0 6px;font-size:13px}
aside label{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer;font-size:13px}
aside .sw{width:10px;height:10px;border-radius:2px;flex:none}
aside .btns{display:flex;gap:4px;margin:6px 0}
main{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
select,input[type=text],button.b{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
button.b{cursor:pointer}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:75vh}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:right;white-space:nowrap}
th{background:var(--bg);position:sticky;top:0;z-index:2;cursor:pointer;font-weight:600}
th small{display:block;color:var(--mut);font-weight:400}
th.grp{text-align:center;cursor:default;font-size:12px;color:var(--mut)}
td:first-child,th:first-child{position:sticky;left:0;text-align:left;background:var(--card);z-index:3;font-weight:600}
th:first-child{background:var(--bg);z-index:4}
tr.ref td{background:var(--ref)}tr.ref td:first-child{background:var(--ref)}
td.best{background:var(--good)}td.worst{background:var(--bad)}
td.na{color:var(--mut)}
.chart{position:relative;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px #0003;display:none;z-index:6;white-space:nowrap}
.sec{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);user-select:none;touch-action:none}
.sec img{display:block;max-width:100%}
.lab{position:absolute;transform:translate(-50%,-50%);background:#fffffff0;color:#111;border:1.5px solid var(--acc);border-radius:6px;padding:2px 7px;font-size:12px;cursor:grab;text-align:center;box-shadow:0 1px 4px #0004}
.lab b{display:block;font-size:14px}
.lab span{font-size:11px}
.lab.up span{color:#b42318}.lab.dn span{color:#067647}
.bars .row{display:flex;align-items:center;gap:8px;margin:3px 0}
.bars .nm{width:110px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .bar{flex:1;display:flex;height:20px;border-radius:4px;overflow:hidden;background:var(--bg)}
.bars .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;overflow:hidden}
.grid{display:grid;gap:8px}
.grid figure{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.grid figcaption{padding:3px 6px;font-size:12px;border-top:1px solid var(--line);color:var(--mut)}
.grid img{display:block;width:100%;height:auto;background:#fff}
.warn{color:#b54708}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>Combustor Post-Process Özeti</h1>
  <span class="mut" id="gen"></span>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <label class="mut">Referans: <select id="refSel"></select></label>
</header>
<div class="wrap">
  <aside>
    <h3>Analizler</h3>
    <div class="btns"><button class="b" id="allB">Hepsi</button><button class="b" id="noneB">Hiçbiri</button></div>
    <div id="alist"></div>
  </aside>
  <main>
    <section id="t_overview"></section>
    <section id="t_profiles" class="hide"></section>
    <section id="t_split" class="hide"></section>
    <section id="t_gallery" class="hide"></section>
    <section id="t_notes" class="hide"></section>
    <section id="t_warn" class="hide"></section>
  </main>
</div>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const PAL = ['#1f77b4','#d62728','#2ca02c','#ff7f0e','#9467bd','#8c564b','#e377c2','#17becf','#bcbd22','#7f7f7f','#393b79','#ad494a'];
const NS = 'http://www.w3.org/2000/svg';
function el(t, a, ...c){const e=document.createElement(t);for(const k in (a||{})){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}c.flat().forEach(x=>{if(x==null)return;e.append(x.nodeType?x:document.createTextNode(String(x)));});return e;}
function sv(t, a, p){const e=document.createElementNS(NS,t);for(const k in (a||{}))e.setAttribute(k,a[k]);if(p)p.append(e);return e;}
const store = {get(k,d){try{const v=localStorage.getItem('cbt_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('cbt_'+k,JSON.stringify(v));}catch(e){}}};
const fmt = (v,d)=> (v==null||isNaN(v))?'–':Number(v).toFixed(d);
const A = D.analyses, names = A.map(a=>a.name);
const color = n => PAL[names.indexOf(n)%PAL.length];
const byName = n => A.find(a=>a.name===n);
let sel = new Set(store.get('sel', names));
sel = new Set([...sel].filter(n=>names.includes(n)));
if(!sel.size) sel = new Set(names);
let REF = store.get('ref', D.reference); if(!names.includes(REF)) REF = D.reference;
const selected = () => A.filter(a=>sel.has(a.name));
const NOTES = store.get('notes', {});
A.forEach(a=>{ if(!NOTES[a.name]) NOTES[a.name]={note:a.note||'',tags:a.tags||''}; });

// ---------- üst bar ----------
$('#gen').textContent = 'Üretim: '+D.generated+' · '+A.length+' analiz';
const TABS = [['overview','Özet / Karşılaştırma'],['profiles','Profiller'],['split','Debi dağılımı'],['gallery','Görseller'],['notes','Notlar'],['warn','Uyarılar']];
let tab = store.get('tab','overview');
function showTab(t){tab=t;store.set('tab',t);TABS.forEach(([k])=>$('#t_'+k).classList.toggle('hide',k!==t));[...$('#nav').children].forEach((b,i)=>b.classList.toggle('on',TABS[i][0]===t));render();}
TABS.forEach(([k,l])=>$('#nav').append(el('button',{onclick:()=>showTab(k)},l)));
$('#refSel').append(...names.map(n=>el('option',{value:n},n)));
$('#refSel').value = REF;
$('#refSel').onchange = e=>{REF=e.target.value;store.set('ref',REF);render();};
$('#allB').onclick=()=>{sel=new Set(names);store.set('sel',[...sel]);drawList();render();};
$('#noneB').onclick=()=>{sel=new Set();store.set('sel',[]);drawList();render();};
function drawList(){
  const box=$('#alist');box.innerHTML='';
  A.forEach(a=>{const cb=el('input',{type:'checkbox'});cb.checked=sel.has(a.name);
    cb.onchange=()=>{cb.checked?sel.add(a.name):sel.delete(a.name);store.set('sel',[...sel]);render();};
    box.append(el('label',{title:a.path},cb,el('i',{class:'sw',style:'background:'+color(a.name)}),a.name,a.warnings.length?el('span',{class:'warn',title:a.warnings.join('\n')},' ⚠'):''));});
}

// ---------- özet tablosu ----------
let mode = store.get('mode','abs'), sortKey = null, sortDir = 1;
function renderOverview(){
  const host=$('#t_overview');host.innerHTML='';
  const ref=byName(REF), rows=selected().slice();
  const mm = D.metrics.filter(m=>rows.some(a=>a.metrics[m.key]!=null)||ref&&ref.metrics[m.key]!=null);
  const modeSel=el('select',{onchange:e=>{mode=e.target.value;store.set('mode',mode);renderOverview();}},
    el('option',{value:'abs'},'Mutlak değer'),el('option',{value:'delta'},'Δ (referansa göre fark)'),el('option',{value:'pct'},'Δ% (referansa göre)'));
  modeSel.value=mode;
  const tools=el('div',{class:'tools'},'Gösterim:',modeSel,el('button',{class:'b',onclick:()=>exportCSV(rows,mm)},'CSV indir'),
    el('span',{class:'mut'},'Başlığa tıkla: sırala · yeşil=iyi, kırmızı=kötü (yalnızca mutlak gösterimde) · sarı satır=referans'));
  if(sortKey) rows.sort((a,b)=>sortDir*((a.metrics[sortKey]??Infinity)-(b.metrics[sortKey]??Infinity)));
  const groups=[];mm.forEach(m=>{const l=groups[groups.length-1];if(l&&l.g===m.group)l.n++;else groups.push({g:m.group,n:1});});
  const tbl=el('table');
  tbl.append(el('thead',{},el('tr',{},el('th',{class:'grp'},''),groups.map(g=>el('th',{class:'grp',colspan:g.n},g.g))),
    el('tr',{},el('th',{},'Analiz'),mm.map(m=>el('th',{onclick:()=>{sortDir=(sortKey===m.key?-sortDir:1);sortKey=m.key;renderOverview();}},m.label,el('small',{},mode==='pct'?'Δ%':(mode==='delta'?'Δ ':'')+m.unit))))));
  const stat={};mm.forEach(m=>{const vals=rows.map(a=>a.metrics[m.key]).filter(v=>v!=null);if(!m.better||vals.length<2||Math.min(...vals)===Math.max(...vals))return;
    const sc=v=>m.better==='low'?v:m.better==='high'?-v:Math.abs(v);stat[m.key]={best:vals.reduce((p,c)=>sc(c)<sc(p)?c:p),worst:vals.reduce((p,c)=>sc(c)>sc(p)?c:p)};});
  const tb=el('tbody');
  rows.forEach(a=>{
    const tr=el('tr',{class:a.name===REF?'ref':''},el('td',{title:a.path},a.name));
    mm.forEach(m=>{
      const v=a.metrics[m.key],r=ref?ref.metrics[m.key]:null;let txt,cls='';
      if(v==null)cls='na',txt='–';
      else if(mode==='abs'){txt=fmt(v,m.digits);if(stat[m.key]){if(v===stat[m.key].best)cls='best';else if(v===stat[m.key].worst)cls='worst';}}
      else if(r==null)cls='na',txt='–';
      else if(mode==='delta'){const d=v-r;txt=(d>0?'+':'')+fmt(d,m.digits);}
      else{txt=r===0?'–':((v-r)/Math.abs(r)*100>0?'+':'')+fmt((v-r)/Math.abs(r)*100,2)+'%';}
      tr.append(el('td',{class:cls},txt));
    });tb.append(tr);});
  tbl.append(tb);
  host.append(el('div',{class:'card'},tools,el('div',{class:'tw'},tbl)));
}
function exportCSV(rows,mm){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=[['Analiz',...mm.map(m=>m.label+' ['+m.unit+']')].map(q).join(';')];
  rows.forEach(a=>lines.push([q(a.name),...mm.map(m=>a.metrics[m.key]==null?'':String(a.metrics[m.key]).replace('.',','))].join(';')));
  dl('ozet.csv','﻿'+lines.join('\n'),'text/csv');
}
function dl(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=el('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500);}

// ---------- çizgi grafik ----------
function niceTicks(a,b,n){n=n||6;if(a===b){a-=1;b+=1;}const sp=b-a,s0=sp/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),r=s0/mag;
  const st=(r<1.5?1:r<3?2:r<7?5:10)*mag;const t=[];for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)t.push(+v.toPrecision(12));return t;}
function lineChart(host, series, o){
  host.innerHTML='';
  const W=Math.max(host.clientWidth||900,420),H=o.height||480,m={l:78,r:18,t:16,b:54};
  const sw=!!o.swap; // swap: span dikey, parametre yatay
  const hx=s=>sw?s.y:s.x, vy=s=>sw?s.x:s.y;
  let X=series.flatMap(hx),Y=series.flatMap(vy);
  if(!X.length){host.textContent='Seçili analizlerde bu profil için veri yok.';return;}
  const ext=(arr)=>{let a=Math.min(...arr),b=Math.max(...arr);const p=(b-a||1)*0.04;return [a-p,b+p];};
  const [x0,x1]=ext(X),[y0,y1]=ext(Y);
  const px=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r), py=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  const svg=sv('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`});
  const fg=getComputedStyle(document.body).color, ln=getComputedStyle(document.body).getPropertyValue('--line');
  niceTicks(x0,x1,8).forEach(t=>{sv('line',{x1:px(t),x2:px(t),y1:m.t,y2:H-m.b,stroke:ln},svg);const tx=sv('text',{x:px(t),y:H-m.b+16,'text-anchor':'middle','font-size':11,fill:fg},svg);tx.textContent=+t.toPrecision(6);});
  niceTicks(y0,y1,8).forEach(t=>{sv('line',{x1:m.l,x2:W-m.r,y1:py(t),y2:py(t),stroke:ln},svg);const tx=sv('text',{x:m.l-6,y:py(t)+4,'text-anchor':'end','font-size':11,fill:fg},svg);tx.textContent=+t.toPrecision(6);});
  sv('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:'none',stroke:fg,'stroke-opacity':.4},svg);
  const xl=sv('text',{x:(m.l+W-m.r)/2,y:H-10,'text-anchor':'middle','font-size':12,fill:fg},svg);xl.textContent=sw?o.ylabel:o.xlabel;
  const yl=sv('text',{transform:`translate(16 ${(m.t+H-m.b)/2}) rotate(-90)`,'text-anchor':'middle','font-size':12,fill:fg},svg);yl.textContent=sw?o.xlabel:o.ylabel;
  series.forEach(s=>{
    const d=s.x.map((_,i)=>(i?'L':'M')+px(hx({x:s.x[i],y:s.y[i]})).toFixed(1)+' '+py(vy({x:s.x[i],y:s.y[i]})).toFixed(1)).join('');
    sv('path',{d,fill:'none',stroke:s.color,'stroke-width':s.ref?3:1.8,'stroke-dasharray':s.ref?'':'0'},svg);
    if(o.markMax&&s.max){const cx=px(sw?s.max.y:s.max.x),cy=py(sw?s.max.x:s.max.y);const c=sv('circle',{cx,cy,r:5,fill:s.color,stroke:'#fff','stroke-width':1.5},svg);const t=sv('title',{},c);t.textContent=`${s.name}: maks ${s.max.y.toPrecision(7)} @ ${s.max.x.toPrecision(5)}`;}
  });
  const cross=sv('line',{stroke:fg,'stroke-opacity':.5,'stroke-dasharray':'4 3',display:'none'},svg);
  const tip=el('div',{class:'tip'});host.append(svg,tip);
  svg.addEventListener('mousemove',ev=>{
    const r=svg.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width,my=(ev.clientY-r.top)*H/r.height;
    if(mx<m.l||mx>W-m.r||my<m.t||my>H-m.b){cross.setAttribute('display','none');tip.style.display='none';return;}
    const q=sw?y0+(H-m.b-my)/(H-m.t-m.b)*(y1-y0):x0+(mx-m.l)/(W-m.l-m.r)*(x1-x0); // span değeri
    const rows=series.map(s=>{let bi=0,bd=Infinity;s.x.forEach((v,i)=>{const d=Math.abs(v-q);if(d<bd){bd=d;bi=i;}});return {s,i:bi};});
    const sq=rows[0].s.x[rows[0].i];
    if(sw){cross.setAttribute('x1',m.l);cross.setAttribute('x2',W-m.r);cross.setAttribute('y1',py(sq));cross.setAttribute('y2',py(sq));}
    else{cross.setAttribute('y1',m.t);cross.setAttribute('y2',H-m.b);cross.setAttribute('x1',px(sq));cross.setAttribute('x2',px(sq));}
    cross.setAttribute('display','');
    tip.innerHTML=`<b>${sw?'Span':o.xlabel}: ${(+sq).toPrecision(4)}</b><br>`+rows.map(({s,i})=>`<span style="color:${s.color}">■</span> ${s.name}: ${(+s.y[i]).toPrecision(6)}`).join('<br>');
    tip.style.display='block';const hr=host.getBoundingClientRect();
    tip.style.left=Math.min(ev.clientX-hr.left+14,host.clientWidth-200)+'px';tip.style.top=(ev.clientY-hr.top+14)+'px';
  });
  svg.addEventListener('mouseleave',()=>{cross.setAttribute('display','none');tip.style.display='none';});
}

// ---------- profiller ----------
let profKey = store.get('prof', D.profiles[0]&&D.profiles[0].key), swapOpt = null;
function renderProfiles(){
  const host=$('#t_profiles');host.innerHTML='';
  if(!D.profiles.length){host.append(el('div',{class:'card'},'config.json içinde profil tanımlı değil.'));return;}
  if(!D.profiles.some(p=>p.key===profKey))profKey=D.profiles[0].key;
  const pd=D.profiles.find(p=>p.key===profKey);
  const ps=el('select',{onchange:e=>{profKey=e.target.value;store.set('prof',profKey);swapOpt=null;renderProfiles();}},D.profiles.map(p=>el('option',{value:p.key},p.label)));ps.value=profKey;
  const sw=swapOpt==null?pd.swap:swapOpt;
  const cb=el('input',{type:'checkbox',onchange:e=>{swapOpt=e.target.checked;renderProfiles();}});cb.checked=sw;
  const ch=el('div',{class:'chart'});
  host.append(el('div',{class:'card'},el('div',{class:'tools'},'Profil:',ps,el('label',{},cb,' Span dikey eksende'),el('span',{class:'mut'},'● = profildeki maksimum (RTDF için circ avg T maks.)')),ch,el('div',{class:'legend',id:'lg'})));
  const ser=selected().filter(a=>a.profiles[profKey]).map(a=>({name:a.name,color:color(a.name),x:a.profiles[profKey].x,y:a.profiles[profKey].y,max:a.profiles[profKey].max,ref:a.name===REF}));
  lineChart(ch,ser,{xlabel:pd.xlabel,ylabel:pd.ylabel,swap:sw,markMax:true});
  $('#lg').append(...ser.map(s=>el('span',{},el('i',{style:'background:'+s.color}),s.name+(s.ref?' (ref)':'')+(s.max?`  maks=${s.max.y.toPrecision(6)} @ ${s.max.x.toPrecision(4)}`:''))));
  const miss=selected().filter(a=>!a.profiles[profKey]).map(a=>a.name);
  if(miss.length)host.append(el('div',{class:'mut'},'Bu profil için dosyası olmayanlar: '+miss.join(', ')));
}

// ---------- debi dağılımı ----------
let splitSel = store.get('splitSel', null), LAYOUT = store.get('layout', {});
function renderSplit(){
  const host=$('#t_split');host.innerHTML='';
  if(!D.split_def.length){host.append(el('div',{class:'card'},'config.json içinde flow_split tanımlı değil.'));return;}
  const rows=selected();if(!rows.length){host.append(el('div',{class:'card'},'Analiz seç.'));return;}
  if(!splitSel||!names.includes(splitSel))splitSel=rows[rows.length-1].name;
  const ss=el('select',{onchange:e=>{splitSel=e.target.value;store.set('splitSel',splitSel);renderSplit();}},A.map(a=>el('option',{value:a.name},a.name)));ss.value=splitSel;
  const cur=byName(splitSel),ref=byName(REF);
  const card=el('div',{class:'card'});
  card.append(el('div',{class:'tools'},'Analiz:',ss,el('button',{class:'b',onclick:()=>{LAYOUT={};store.set('layout',LAYOUT);renderSplit();}},'Etiket konumlarını sıfırla'),
    el('button',{class:'b',onclick:()=>{const o={};D.split_def.forEach(s=>o[s.label]=LAYOUT[s.key]||[s.x,s.y]);dl('layout.json',JSON.stringify(o,null,1),'application/json');}},'Konumları indir (config için)'),
    el('span',{class:'mut'},'Etiketleri sürükleyerek kesit üzerinde yerleştir; konumlar tarayıcıda saklanır. Kırmızı/yeşil: referansa göre artış/azalış (yüzde puan).')));
  if(D.section_image){
    const box=el('div',{class:'sec'},el('img',{src:D.section_image,draggable:'false'}));
    D.split_def.forEach(s=>{
      const v=cur.metrics[s.key],r=ref?ref.metrics[s.key]:null,pos=LAYOUT[s.key]||[s.x,s.y];
      const d=(v!=null&&r!=null&&cur.name!==REF)?v-r:null;
      const lab=el('div',{class:'lab'+(d==null?'':d>0.005?' up':d<-0.005?' dn':''),style:`left:${pos[0]*100}%;top:${pos[1]*100}%`},s.label,el('b',{},v==null?'–':fmt(v,2)+' %'),el('span',{},d==null?'':(d>0?'+':'')+fmt(d,2)+' pp'));
      lab.addEventListener('pointerdown',ev=>{ev.preventDefault();lab.setPointerCapture(ev.pointerId);lab.style.cursor='grabbing';
        const mv=e=>{const r=box.getBoundingClientRect();const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));lab.style.left=x*100+'%';lab.style.top=y*100+'%';LAYOUT[s.key]=[+x.toFixed(4),+y.toFixed(4)];};
        const up=()=>{lab.style.cursor='grab';lab.removeEventListener('pointermove',mv);lab.removeEventListener('pointerup',up);store.set('layout',LAYOUT);};
        lab.addEventListener('pointermove',mv);lab.addEventListener('pointerup',up);});
      box.append(lab);
    });
    card.append(box);
  }else card.append(el('div',{class:'mut'},'Kesit görseli yok: config.json > section_image yolunu ver (png/jpg). Aşağıdaki çubuk grafik yine çalışır.'));
  host.append(card);
  // yığılmış çubuk
  const bars=el('div',{class:'card bars'},el('h3',{style:'margin:0 0 8px;font-size:14px'},'Debi dağılımı (giriş debisinin %’si)'));
  const sc=(i)=>PAL[i%PAL.length];
  rows.forEach(a=>{
    const bar=el('div',{class:'bar'});D.split_def.forEach((s,i)=>{const v=a.metrics[s.key];if(v==null)return;bar.append(el('div',{class:'seg',style:`width:${Math.max(v,0)}%;background:${sc(i)}`,title:`${s.label}: ${fmt(v,2)}%`},v>4?fmt(v,1):''));});
    bars.append(el('div',{class:'row'},el('div',{class:'nm',title:a.name},a.name),bar,el('span',{class:'mut'},'Σ '+fmt(a.metrics.split_sum,1)+'%')));});
  bars.append(el('div',{class:'legend'},D.split_def.map((s,i)=>el('span',{},el('i',{style:'background:'+sc(i)}),s.label))));
  host.append(bars);
}

// ---------- görseller ----------
let galFile = store.get('galFile',''), galSize = store.get('galSize',320), galOne = store.get('galOne','');
function renderGallery(){
  const host=$('#t_gallery');host.innerHTML='';
  const rows=selected();
  const base=p=>p.split('/').pop();
  const all=[...new Set(rows.flatMap(a=>a.images.map(base)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!all.length){host.append(el('div',{class:'card'},'Görsel bulunamadı (config.json > images desenleri).'));return;}
  const q=el('input',{type:'text',placeholder:'dosya adı filtrele…',value:galFile,oninput:e=>{galFile=e.target.value;store.set('galFile',galFile);fill();}});
  const sz=el('input',{type:'range',min:160,max:900,value:galSize,oninput:e=>{galSize=+e.target.value;store.set('galSize',galSize);fill();}});
  const sel1=el('select',{onchange:e=>{galOne=e.target.value;store.set('galOne',galOne);fill();}},el('option',{value:''},'— aynı görseli analizler arası karşılaştır —'),all.map(n=>el('option',{value:n},n)));sel1.value=galOne;
  const one=el('select',{onchange:e=>{galOne='@'+e.target.value;store.set('galOne',galOne);fill();}},el('option',{value:''},'— veya tek analizin tüm görselleri —'),rows.map(a=>el('option',{value:a.name},a.name)));
  if(galOne.startsWith('@'))one.value=galOne.slice(1);
  host.append(el('div',{class:'card'},el('div',{class:'tools'},sel1,one,q,'Boyut',sz)));
  const grid=el('div',{class:'grid'});host.append(el('div',{class:'card'},grid));
  function fill(){
    grid.innerHTML='';grid.style.gridTemplateColumns=`repeat(auto-fill,minmax(${galSize}px,1fr))`;
    const f=galFile.toLowerCase();let items=[];
    if(galOne.startsWith('@')){const a=byName(galOne.slice(1));items=(a?a.images:[]).filter(p=>base(p).toLowerCase().includes(f)).map(p=>({cap:base(p),src:p}));}
    else if(galOne){items=rows.flatMap(a=>a.images.filter(p=>base(p)===galOne).map(p=>({cap:a.name+(a.name===REF?' (ref)':''),src:p})));}
    else{items=rows.flatMap(a=>a.images.filter(p=>base(p).toLowerCase().includes(f)).map(p=>({cap:a.name+' / '+base(p),src:p})));}
    if(!items.length){grid.append(el('div',{class:'mut'},'Eşleşen görsel yok.'));return;}
    items.slice(0,400).forEach(it=>{const img=el('img',{src:encodeURI(it.src),loading:'lazy',title:it.src});img.onerror=()=>{img.replaceWith(el('div',{class:'warn',style:'padding:8px'},'Açılamadı: '+it.src));};
      grid.append(el('figure',{},el('a',{href:encodeURI(it.src),target:'_blank'},img),el('figcaption',{},it.cap)));});
  }
  fill();
}

// ---------- notlar ----------
function renderNotes(){
  const host=$('#t_notes');host.innerHTML='';
  const tb=el('tbody');
  A.forEach(a=>{const n=NOTES[a.name];
    tb.append(el('tr',{},el('td',{},a.name),el('td',{style:'text-align:left'},el('input',{type:'text',style:'width:260px',value:n.tags,placeholder:'etiket: ör. dilution+5%',oninput:e=>{n.tags=e.target.value;store.set('notes',NOTES);}})),
      el('td',{style:'text-align:left'},el('input',{type:'text',style:'width:520px',value:n.note,placeholder:'not',oninput:e=>{n.note=e.target.value;store.set('notes',NOTES);}})),el('td',{},a.mtime)));});
  host.append(el('div',{class:'card'},el('div',{class:'tools'},el('button',{class:'b',onclick:()=>{const o={};A.forEach(a=>{o[a.name]={note:NOTES[a.name].note,tags:NOTES[a.name].tags};});dl('notes.json',JSON.stringify(o,null,1),'application/json');}},'notes.json indir'),
    el('span',{class:'mut'},'Notlar tarayıcıda saklanır. İndirdiğin notes.json’u çıktı klasörüne koyarsan bir sonraki build’de kalıcı olur. T maks gibi değerleri elle girmek için notes.json içinde "overrides": {"Tmax_exit": 1650} ekleyebilirsin.')),
    el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},['Analiz','Etiket','Not','Değişiklik'].map(h=>el('th',{},h)))),tb))));
}

// ---------- uyarılar ----------
function renderWarn(){
  const host=$('#t_warn');host.innerHTML='';
  const c=el('div',{class:'card'});let n=0;
  A.forEach(a=>{if(!a.warnings.length)return;n+=a.warnings.length;c.append(el('h3',{style:'margin:8px 0 2px'},a.name),el('ul',{},a.warnings.map(w=>el('li',{},w))));});
  if(!n)c.append('Uyarı yok. ✔');
  host.append(c);
}

function render(){drawList();({overview:renderOverview,profiles:renderProfiles,split:renderSplit,gallery:renderGallery,notes:renderNotes,warn:renderWarn})[tab]();}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(tab==='profiles')renderProfiles();},200);});
showTab(TABS.some(t=>t[0]===tab)?tab:'overview');
</script>
